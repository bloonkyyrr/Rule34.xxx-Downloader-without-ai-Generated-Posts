name: Nightly Build & Release

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore HtmlAgilityPack
        run: |
          nuget install HtmlAgilityPack -Version 1.12.4 -OutputDirectory packages
          New-Item -ItemType Directory -Force -Path "Rule34.xxx Downloader\lib" | Out-Null
          $hap = Get-ChildItem -Path packages -Recurse -Filter HtmlAgilityPack.dll |
            Where-Object { $_.DirectoryName -match 'net45|net48|Net45' } |
            Select-Object -First 1
          if (-not $hap) {
            $hap = Get-ChildItem -Path packages -Recurse -Filter HtmlAgilityPack.dll | Select-Object -First 1
          }
          Copy-Item $hap.FullName "Rule34.xxx Downloader\lib\HtmlAgilityPack.dll" -Force

      - name: Build
        run: msbuild "Rule34.xxx Downloader.sln" /p:Configuration=Release /p:Platform="Any CPU" /p:OutDir="${{ github.workspace }}\publish\\"

      - name: Compress publish directory
        run: tar -czf release-nightly.tar.gz -C ./publish .

      - name: Create or update nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          files: release-nightly.tar.gz
