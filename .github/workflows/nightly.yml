name: Nightly Build & Release

on:
  # Triggers every Sunday at midnight UTC
  schedule:
    - cron: '0 0 * * 0'
  # Allows manually triggering the workflow from the Actions tab
  workflow_dispatch:

jobs:
  nightly-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create GitHub Releases

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Package build artifacts
        run: tar -czvf build-nightly.tar.gz dist/ # Replace 'dist/' with your build folder name (e.g. build/)

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build - ${{ github.ref_name }}"
          body: "Automated weekly build generated on ${{ github.event.schedule }}"
          prerelease: true
          files: build-nightly.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
